<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binero Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Binero</h1>
        <div class="grid" id="grid"></div>
        <div class="info">
            Click cells to cycle: Unfilled → Full → Empty → Unfilled
        </div>
        <div class="controls">
            <button onclick="newPuzzle('easy')">New Easy</button>
            <button onclick="newPuzzle('medium')">New Medium</button>
            <button onclick="newPuzzle('hard')">New Hard</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
